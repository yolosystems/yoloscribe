# yoloscribe-external-secrets — example values.
#
# Copy to external-secrets.{STAGE}.{REGION}.values.yaml in yoloscribe-ops.
# There are no secret values in this file and there should never be; it names
# where secrets come from, not what they are.

secretStore:
  # The SecretStore is cluster scaffolding shared with YoloBrain, and exactly one
  # release may create a given name. Leave false when deploying alongside
  # YoloBrain, whose external-secrets chart owns it.
  create: false
  name: yolo-aws
  kind: SecretStore
  # Only read when create is true.
  region: "<region>"
  serviceAccountName: "<eso-service-account>"

# Deployment secrets only. NOT `yoloscribe/`, which is the runtime per-user
# namespace — see infra/iam/README-eso.md.
secretsPrefix: "yoloscribe/deploy"

refreshInterval: "1h"
