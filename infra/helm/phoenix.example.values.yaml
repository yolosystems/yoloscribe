# Arize Phoenix — example values for the OFFICIAL vendor Helm chart
#   oci://registry-1.docker.io/arizephoenix/phoenix-helm
#
# Phoenix provides OTEL tracing and eval annotation for both YoloScribe and
# YoloBrain — the backend and agent-runner point PHOENIX_API_ENDPOINT and the
# OTEL exporter at it (see the env-var table in CLAUDE.md).
#
# Deployed the same way as LiteLLM: vendor chart, no fork, one values file per
# environment. Copy this to phoenix.{STAGE}.{REGION}.values.yaml in
# yoloscribe-ops and install with:
#
#   yolo install phoenix --values-dir ~/Projects/yolo/yoloscribe-ops/helm
#
# No secret is set here. `yolo install` writes them to Secrets Manager and
# External Secrets syncs them into phoenix-secret (see Auth below).
# Verify keys against the chart version you pin.

# ── External Postgres is REQUIRED ─────────────────────────────────────────────
# Phoenix must run against the shared RDS instance. It is a deployment
# prerequisite, on the same footing as the EKS Auto Mode cluster, ExternalDNS
# and External Secrets — see yoloscribe-ops/CLUSTER.md.
#
# The chart offers three storage strategies and DEFAULTS TO THE WRONG ONE for us
# (postgresql.enabled: true, which deploys a bundled Postgres and claims a 20Gi
# volume). Both settings below must be explicit:
#
#   postgresql.enabled: false   — do not deploy the bundled groundhog2k Postgres
#   persistence.enabled: false  — do not fall back to SQLite on a PVC
#
# Two reasons this is a requirement rather than a preference. Trace data is the
# input to eval annotation and is worth keeping across a pod restart, which a
# bundled Postgres on a single node is a poor way to guarantee. And the chart's
# postgresql.storage block exposes no storageClass key, so its PVC inherits the
# cluster default — on a cluster with none, the install hangs Pending with
# nothing reported on the pod.
postgresql:
  enabled: false

persistence:
  enabled: false

database:
  # Leave url empty and use the postgres.* fields below. Set url instead only if
  # you need options the fields cannot express (e.g. an explicit sslmode).
  url: ""
  readReplicaUrl: ""
  postgres:
    host: "<rds-endpoint>.xxxxxxxx.<region>.rds.amazonaws.com"  # TODO
    port: 5432
    db: "phoenix"
    user: "phoenix_app"   # the role db-bootstrap creates
    # read from phoenix-secret (PHOENIX_POSTGRES_PASSWORD) — never set here.
    password: ""
    # RDS IAM auth is supported (useAwsIamAuth: true) and removes the password
    # secret entirely, but needs the image built with arize-phoenix[aws] and an
    # IRSA role. Not used today.
    useAwsIamAuth: false
  # Traces accumulate indefinitely at 0. Set a day count once you know your
  # volume — this is a shared RDS instance.
  defaultRetentionPolicyDays: 0

image:
  registry: docker.io
  repository: arizephoenix/phoenix
  tag: version-19.9.0-nonroot   # pin to a known-good release

# ── No public ingress ─────────────────────────────────────────────────────────
# Phoenix holds trace data — prompts, completions, tool arguments — and has no
# place on the public ALB. Reach it with:
#   kubectl port-forward svc/phoenix -n <namespace> 6006:6006
# YoloScribe and YoloBrain reach it over cluster DNS, which is unaffected.
ingress:
  enabled: false

service:
  type: ClusterIP

server:
  port: 6006        # web UI + HTTP API + OTLP/http  (PHOENIX_API_ENDPOINT)
  grpcPort: 4317    # OTLP/gRPC collector

# ── Auth ──────────────────────────────────────────────────────────────────────
# Left on. The chart does NOT create this Secret: External Secrets syncs it from
# yoloscribe/{stage}/deploy/phoenix, which `yolo install` writes with the five
# keys chart 12.0.5 reads — PHOENIX_SECRET, PHOENIX_ADMIN_SECRET,
# PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD, PHOENIX_SMTP_PASSWORD and
# PHOENIX_POSTGRES_PASSWORD. None is optional in the chart. Enable the phoenix
# entry in yoloscribe-external-secrets alongside this.
auth:
  enableAuth: true
  createSecret: false
  name: phoenix-secret

resources: {}
