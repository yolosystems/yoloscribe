image:
  repository: ghcr.io/<ghcr-user>/yoloscribe-backend
  tag: latest
  pullPolicy: Always

ghcr:
  username: <ghcr-user>

serviceAccount:
  iamRoleArn: "arn:aws:iam::<aws-account-id>:role/yoloscribe-backend"  # set after running infra/iam/create_backend_role.sh

ingress:
  host: api.<your-domain>
  # controllerType: eks-auto-mode  # uncomment on an EKS Auto Mode cluster (default: aws-load-balancer-controller)

config:
  supabaseUrl: "https://<supabase-project>.supabase.co"
  mcpBaseUrl: "https://api.<your-domain>"
  cloudfrontDomain: "app.<your-domain>"
  cloudfrontMediaDomain: "media.<your-domain>"
  cloudfrontMediaDistributionId: "<cloudfront-media-distribution-id>"
  cloudfrontSigningKeyId: "<cloudfront-key-pair-id>"
  s3Bucket: "<s3-bucket>"
  s3VectorsBucket: "<s3-vectors-bucket>"
  allowedOrigins: "https://app.<your-domain>"
  sqsQueueUrl: "https://sqs.<region>.amazonaws.com/<aws-account-id>/<prefix>-jobs"
  sqsIndexingQueueUrl: "https://sqs.<region>.amazonaws.com/<aws-account-id>/<prefix>-indexing"
  eksOidcProvider: "oidc.eks.<region>.amazonaws.com/id/<oidc-id>"
  awsAccountId: "<aws-account-id>"
  awsRegion: "<region>"
  k8sNamespace: "<k8s-namespace>"
  # model: "glm"  # optional: default model key (a LiteLLM model_name: haiku|sonnet|opus|glm|bedrock-*)
  # LiteLLM proxy — the single model path (YOL-512). Point at the in-cluster LiteLLM service:
  litellmBaseUrl: "http://yoloscribe-litellm.yolo.svc.cluster.local:4000/v1"
  # PUBLIC base URL of the LiteLLM MCP gateway (YOL-505) — tool OAuth enrollment runs
  # against {litellmMcpUrl}/mcp/{tool}. This drives a BROWSER-facing OAuth flow, so it
  # must be the public ingress hostname, NOT a cluster-internal service DNS. Requires
  # the LiteLLM ingress to be exposed. Leave empty to disable tool OAuth.
  litellmMcpUrl: "https://litellm.example.com"
