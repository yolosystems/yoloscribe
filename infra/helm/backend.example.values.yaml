image:
  repository: ghcr.io/<ghcr-user>/yoloscribe-backend
  tag: latest
  pullPolicy: Always

ghcr:
  username: <ghcr-user>

serviceAccount:
  iamRoleArn: "arn:aws:iam::<aws-account-id>:role/yoloscribe-backend"  # set after running infra/iam/create_backend_role.sh

ingress:
  host: api.<your-domain>
  # controllerType: eks-auto-mode  # uncomment on an EKS Auto Mode cluster (default: aws-load-balancer-controller)

config:
  # ── Auth provider: supabase (default) | cognito | oidc ──────────────────────
  authProvider: "supabase"

  # Used when authProvider=supabase. Keep it set even under oidc if inbound MCP
  # clients (LiteLLM, Claude Code) authorize through Supabase's OAuth 2.1 server —
  # /oauth/consent is that flow's approval UI.
  supabaseUrl: "https://<supabase-project>.supabase.co"

  # Used when authProvider=oidc. Works with any OIDC-compliant provider — Auth0,
  # Keycloak, Okta, Entra, Cognito — since endpoints are read from the discovery
  # document. Register a PUBLIC / SPA client (authorization code + PKCE, no
  # client secret) with the site origin as its redirect URI.
  #
  # Leave `audience` empty unless your IdP issues a separate API audience: it
  # defaults to clientId, which is what the ID token's `aud` carries. If you do
  # set it, the frontend must also build with VITE_OIDC_TOKEN=access or every
  # request 401s.
  #
  # oidc:
  #   configUrl: "https://<idp>/.well-known/openid-configuration"
  #   clientId: "<spa-client-id>"
  #   audience: ""
  #   issuer: ""
  #
  # Switching provider is a two-sided change — the frontend must be rebuilt with
  # matching VITE_AUTH_PROVIDER / VITE_OIDC_* values, or tokens will not validate.
  # See "Any OIDC provider" in INSTALL.md.

  mcpBaseUrl: "https://api.<your-domain>"
  cloudfrontDomain: "app.<your-domain>"
  cloudfrontMediaDomain: "media.<your-domain>"
  cloudfrontMediaDistributionId: "<cloudfront-media-distribution-id>"
  cloudfrontSigningKeyId: "<cloudfront-key-pair-id>"
  s3Bucket: "<s3-bucket>"
  s3VectorsBucket: "<s3-vectors-bucket>"
  allowedOrigins: "https://app.<your-domain>"
  sqsQueueUrl: "https://sqs.<region>.amazonaws.com/<aws-account-id>/<prefix>-jobs"
  sqsIndexingQueueUrl: "https://sqs.<region>.amazonaws.com/<aws-account-id>/<prefix>-indexing"
  eksOidcProvider: "oidc.eks.<region>.amazonaws.com/id/<oidc-id>"
  awsAccountId: "<aws-account-id>"
  awsRegion: "<region>"
  k8sNamespace: "<k8s-namespace>"
  # model: "glm"  # optional: default model key (a LiteLLM model_name: haiku|sonnet|opus|glm|bedrock-*)
  # LiteLLM proxy — the single model path (YOL-512). Point at the in-cluster LiteLLM service:
  litellmBaseUrl: "http://yoloscribe-litellm.yolo.svc.cluster.local:4000/v1"
  # PUBLIC base URL of the LiteLLM MCP gateway (YOL-505) — tool OAuth enrollment runs
  # against {litellmMcpUrl}/mcp/{tool}. This drives a BROWSER-facing OAuth flow, so it
  # must be the public ingress hostname, NOT a cluster-internal service DNS. Requires
  # the LiteLLM ingress to be exposed. Leave empty to disable tool OAuth.
  litellmMcpUrl: "https://litellm.example.com"
  # Hide inbound/self MCP servers from the Tools panel (comma-separated names) —
  # e.g. the "yoloscribe" server that fronts YoloScribe's own MCP for external clients.
  toolsHiddenMcpServers: "yoloscribe"

# ── YoloBrain signal delivery (optional) ─────────────────────────────────────
# Forwards knowledge-management signals to a YoloBrain deployment. Plain config,
# not a secret. Setting apiUrl is what wires YOLOBRAIN_INTERNAL_SECRET in from
# the backend's Secret, so leaving it empty disables delivery silently rather
# than failing — which is the intended behaviour when you have no YoloBrain.
#
# Must be the IN-CLUSTER service address. /internal/* is blocked at the load
# balancer, so a public hostname returns 403 on every request.
yolobrain:
  apiUrl: ""   # e.g. http://yolobrain-api.<namespace>.svc.cluster.local:8080
