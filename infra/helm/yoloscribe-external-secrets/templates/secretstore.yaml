{{/*
YoloScribe's own SecretStore, with its own IRSA identity.

Each product owns one. Exactly one release may create a given name — Helm
refuses to adopt another release's object, so a second `create: true` on this
name fails on install and on every upgrade after.
*/}}
{{- if .Values.secretStore.create }}
apiVersion: external-secrets.io/v1
kind: {{ .Values.secretStore.kind }}
metadata:
  name: {{ .Values.secretStore.name }}
  {{- if eq .Values.secretStore.kind "SecretStore" }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "yoloscribe-external-secrets.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "secretStore.region is required when secretStore.create is true" .Values.secretStore.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.secretStore.serviceAccountName | default (include "yoloscribe-external-secrets.serviceAccountName" .) }}
{{- end }}
