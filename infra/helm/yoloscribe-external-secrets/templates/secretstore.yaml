{{/*
The SecretStore is shared with YoloBrain. Exactly one release may create a given
name — Helm refuses to adopt another release's object — so this is off by
default and YoloBrain's external-secrets chart owns it. Turn it on only for a
standalone YoloScribe deployment.
*/}}
{{- if .Values.secretStore.create }}
apiVersion: external-secrets.io/v1
kind: {{ .Values.secretStore.kind }}
metadata:
  name: {{ .Values.secretStore.name }}
  {{- if eq .Values.secretStore.kind "SecretStore" }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "yoloscribe-external-secrets.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "secretStore.region is required when secretStore.create is true" .Values.secretStore.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ required "secretStore.serviceAccountName is required when secretStore.create is true" .Values.secretStore.serviceAccountName }}
{{- end }}
