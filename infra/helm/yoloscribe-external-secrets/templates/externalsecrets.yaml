{{- $root := . }}
{{- range $name, $es := .Values.externalSecrets }}
{{- if $es.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.targetSecret }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "yoloscribe-external-secrets.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $root.Values.secretStore.name }}
    kind: {{ $root.Values.secretStore.kind }}
  target:
    name: {{ $es.targetSecret }}
    # Owner: ESO creates and fully manages this Secret, and reverts manual edits.
    # Change values in Secrets Manager, never with kubectl edit.
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ include "yoloscribe-external-secrets.secretsPrefix" $root }}/{{ $es.remoteKey }}
{{- end }}
{{- end }}
