{{/*
The identity ESO uses to read YoloScribe's deployment secrets.

External Secrets holds no AWS credentials of its own: each SecretStore names a
serviceAccountRef, and the operator exchanges *that* ServiceAccount's projected
token for AWS credentials via IRSA. Identity is therefore per-store, which is
why YoloScribe has its own rather than borrowing YoloBrain's.

That separation is what keeps the grant narrow. A single shared identity would
have to hold the union of both products' grants, so a SecretStore misconfigured
in one product could read the other's secrets. It is not a defence against a
compromised ESO controller — the operator's ClusterRole can mint a token for any
ServiceAccount — but it does bound what a misconfigured store can reach.

The name carries no stage. The trust policy's subject is
system:serviceaccount:{namespace}:{name}, and two stages never share a namespace
(usually not even a cluster, which changes the OIDC provider as well), so a
stage here would be decoration. The IAM role it maps to *is* stage-scoped,
because roles are account-global and stages share an AWS account.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "yoloscribe-external-secrets.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yoloscribe-external-secrets.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.iamRoleArn is required: without it ESO gets no AWS credentials and every ExternalSecret fails to sync" .Values.serviceAccount.iamRoleArn | quote }}
{{- end }}
