{{/*
A registry credential is not a plain key copy — Kubernetes wants a
kubernetes.io/dockerconfigjson Secret whose single key is a JSON document. ESO
builds it with a template over the fetched username/pat.
*/}}
{{- $root := . }}
{{- if .Values.imagePullSecrets.enabled }}
{{- range $target := .Values.imagePullSecrets.targets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $target }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "yoloscribe-external-secrets.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $root.Values.secretStore.name }}
    kind: {{ $root.Values.secretStore.kind }}
  target:
    name: {{ $target }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"{{ $root.Values.imagePullSecrets.registry }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .pat }}` }}","auth":"{{ `{{ printf "%s:%s" .username .pat | b64enc }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $root.Values.secretsPrefix }}/{{ $root.Values.imagePullSecrets.remoteKey }}
        property: username
    - secretKey: pat
      remoteRef:
        key: {{ $root.Values.secretsPrefix }}/{{ $root.Values.imagePullSecrets.remoteKey }}
        property: pat
{{- end }}
{{- end }}
