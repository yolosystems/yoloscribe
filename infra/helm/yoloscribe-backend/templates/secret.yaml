{{- if and (not .Values.existingSecret) .Values.anthropicApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yoloscribe-backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yoloscribe-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecretKey }}: {{ .Values.anthropicApiKey | quote }}
  {{- if .Values.litellmApiKey }}
  {{ .Values.litellmExistingSecretKey | default "litellm-api-key" }}: {{ .Values.litellmApiKey | quote }}
  {{- end }}
  {{- if .Values.supabaseServiceRoleKey }}
  supabase-service-role-key: {{ .Values.supabaseServiceRoleKey | quote }}
  {{- end }}
  {{- if .Values.messagingBotSecret }}
  {{ .Values.messagingBotExistingSecretKey | default "messaging-bot-secret" }}: {{ .Values.messagingBotSecret | quote }}
  {{- end }}
{{- end }}
