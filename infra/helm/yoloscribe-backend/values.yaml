# ── Image ────────────────────────────────────────────────────────────────────
image:
  repository: ""
  tag: latest
  pullPolicy: Always

# ── GitHub Container Registry credentials ────────────────────────────────────
# Never set ghcr.pat here — pass it via --set on the command line.
ghcr:
  username: ""          # set in environment-specific values file
  pat: ""               # pass via --set; never commit a real value

# ── Replicas & autoscaling ────────────────────────────────────────────────────
replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 8000

# ── Ingress (ALB via the self-managed AWS Load Balancer Controller, or
#    EKS Auto Mode's built-in ALB support) ─────────────────────────────────────
ingress:
  enabled: true
  host: ""
  certificateArn: ""
  # "aws-load-balancer-controller" (default) — self-managed OSS controller,
  #   configured entirely via annotations (kubernetes.io/ingress.class: alb, etc.)
  # "eks-auto-mode" — EKS Auto Mode's built-in ALB support. Creates an
  #   IngressClass + IngressClassParams (eks.amazonaws.com/v1) instead of using
  #   the legacy ingress-class/group.name annotations, which Auto Mode doesn't
  #   support. See https://docs.aws.amazon.com/eks/latest/userguide/auto-configure-alb.html
  controllerType: aws-load-balancer-controller
  # ALB scheme. Used as the alb.ingress.kubernetes.io/scheme annotation in
  # aws-load-balancer-controller mode, or IngressClassParams.spec.scheme in
  # eks-auto-mode.
  scheme: internet-facing
  # ALB Ingress Group — set group.name to share an ALB with mcp-helm.
  # Both charts must use the same group.name. YoloScribe owns the catch-all
  # path (/) so it should have the highest group.order number (lowest priority).
  # In eks-auto-mode, group.order is not supported (Auto Mode doesn't expose an
  # equivalent) — only group.name is used, via IngressClassParams.
  group:
    name: ""    # e.g. yolo-prod; leave empty for a dedicated ALB
    order: 20   # lowest priority — catch-all route (aws-load-balancer-controller only)
  # Annotations applied in aws-load-balancer-controller mode. In eks-auto-mode,
  # kubernetes.io/ingress.class is dropped (replaced by spec.ingressClassName)
  # but the rest still apply as documented ALB behavior annotations.
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"

# ── Service account (IRSA) ───────────────────────────────────────────────────
# The attached IAM role must have the policy defined in
# infra/iam/yoloscribe-backend-policy.json, which covers:
#   - s3:GetObject / PutObject / DeleteObject / ListBucket  on yoloscribe-* buckets
#   - secretsmanager:CreateSecret / PutSecretValue / GetSecretValue / DescribeSecret
#     on yoloscribe* secrets (per-user API keys + CloudFront signing key)
#   - iam:CreateRole / PutRolePolicy / GetRole on yoloscribe-user-* roles
#   - sqs:SendMessage on yoloscribe-* queues
serviceAccount:
  create: true
  iamRoleArn: ""

# ── Application config ────────────────────────────────────────────────────────
config:
  s3Bucket: ""
  allowedOrigins: ""
  sqsQueueUrl: ""
  sqsIndexingQueueUrl: ""
  eksOidcProvider: ""
  awsAccountId: ""
  awsRegion: ""
  k8sNamespace: ""
  cloudfrontDomain: ""
  # CloudFront signed-cookie media delivery (leave empty to disable).
  # cloudfrontSigningKeyId: the key pair ID returned by setup_cloudfront_media.sh
  # cloudfrontMediaDomain: CloudFront domain for /{site}/assets/* (may differ from cloudfrontDomain)
  cloudfrontSigningKeyId: ""
  cloudfrontMediaDomain: ""
  s3VectorsBucket: ""
  s3VectorsIndexName: "yoloscribe"
  bedrockEmbeddingModel: "amazon.titan-embed-text-v2:0"
  mcpBaseUrl: ""
  # Optional Anthropic API base URL override (leave empty to use the Anthropic default).
  # Set to a Bedrock Mantle endpoint to route all Anthropic model calls through it.
  modelBaseUrl: ""
  # Global model key fallback (a LiteLLM model_name: haiku|sonnet|opus|glm|bedrock-*).
  # Overrides the default (see YOLOSCRIBE_MODEL in CLAUDE.md). Leave empty to use "sonnet".
  model: ""
  # LiteLLM proxy OpenAI endpoint — the single model path (YOL-512). REQUIRED for a
  # working deploy; e.g. http://yoloscribe-litellm.yolo.svc.cluster.local:4000/v1
  litellmBaseUrl: ""
  # PUBLIC base URL of the LiteLLM MCP gateway (YOL-505) — tool OAuth enrollment
  # runs against {litellmMcpUrl}/mcp/{tool}. Unlike litellmBaseUrl (server-to-server,
  # in-cluster), this drives a BROWSER-facing OAuth flow, so it must be publicly
  # reachable (the LiteLLM ingress hostname), NOT a cluster-internal service DNS.
  # Leave empty to disable tool OAuth (/oauth/initiate returns 500 when unset).
  litellmMcpUrl: ""
  # Comma-separated LiteLLM MCP server names to HIDE from the Tools panel — the
  # inbound/self servers (e.g. "yoloscribe") that front YoloScribe's own MCP for
  # external clients. They're oauth2 but aren't outbound tools a user connects.
  toolsHiddenMcpServers: ""
  # Auth provider — supabase (default) | cognito | oidc
  authProvider: "supabase"
  # Supabase (only used when authProvider=supabase)
  supabaseUrl: ""
  # Generic OIDC (only used when authProvider=oidc). Point configUrl at any
  # OIDC-compatible provider's discovery document; jwks_uri + issuer are read
  # from it. No client secret is needed — YoloScribe only validates tokens.
  oidc:
    configUrl: ""   # e.g. https://your-tenant.auth0.com/.well-known/openid-configuration
    clientId: ""    # used as the default token audience when audience is empty
    audience: ""    # optional explicit token audience (else falls back to clientId)
    issuer: ""      # optional issuer override (else derived from discovery)

# ── Webhook secret (for /webhooks/user-created) ───────────────────────────────
# Pass via --set on the command line; never commit a real value here.
webhookSecret: ""

# ── Supabase service role key (authProvider=supabase) ─────────────────────────
# Pass via --set on the command line; never commit a real value here.
supabaseServiceRoleKey: ""

# ── Cognito config (authProvider=cognito) ─────────────────────────────────────
cognito:
  userPoolId: ""
  clientId: ""
  domain: ""                                        # e.g. https://your-pool.auth.us-east-1.amazoncognito.com

# ── DynamoDB tables (authProvider=cognito or oidc) ────────────────────────────
# The user→site, API-token, and messaging-config stores for any non-Supabase IdP.
dynamodb:
  userSiteTable: "yoloscribe-user-site"
  apiTokensTable: "yoloscribe-api-tokens"
  messagingConfigsTable: "yoloscribe-messaging-configs"

# ── OIDC client secret ───────────────────────────────────────────────────────
# Intentionally unused. POLICY: frontend login is public-client PKCE only —
# browsers cannot hold a secret safely — and the backend is a pure resource
# server that only VALIDATES issued JWTs. Neither path uses a client secret, and
# a confidential/secret-bearing browser login is explicitly NOT supported. A
# secret could only ever apply to a hypothetical SERVER-SIDE flow (e.g. a BFF or
# machine-to-machine exchange), never the browser; if that ever ships, store it
# under the provider-neutral key `oidc-client-secret` (value `oidcClientSecret`).
# Pass via --set; never commit a real value here.

# ── OTEL / Arize Phoenix tracing ─────────────────────────────────────────────
# Set endpoint to the internal Phoenix service DNS name to enable tracing.
# Pass headers via --set on the command line; never commit a real value here.
otel:
  endpoint: ""   # e.g. http://phoenix-svc.arize.svc.cluster.local:6006
  headers: ""    # e.g. "Authorization=Bearer <token>" — pass via --set

# ── Anthropic API key secret ──────────────────────────────────────────────────
# Option A: reference an existing Kubernetes secret (recommended for production)
#   existingSecret: yoloscribe-secrets
#   existingSecretKey: anthropic-api-key
#
# Option B: pass the key directly (for development only — do not commit)
#   anthropicApiKey: "sk-ant-..."
existingSecret: ""
existingSecretKey: anthropic-api-key
anthropicApiKey: ""

# ── LiteLLM proxy API key (YOL-512) ───────────────────────────────────────────
# The key the backend presents to the LiteLLM proxy (its master key, or a
# per-user virtual key under YOL-513). Passed via --set by install_backend.sh
# (from $LITELLM_MASTER_KEY); with existingSecret, add this key to that secret.
litellmApiKey: ""
litellmExistingSecretKey: litellm-api-key

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# ── Probes ────────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
