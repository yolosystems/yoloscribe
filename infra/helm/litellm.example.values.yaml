# LiteLLM — example values for the OFFICIAL chart:
#   oci://ghcr.io/berriai/litellm-helm
#
# Ported from the bundled fork (yolobrain/helm/litellm) and VERIFIED by rendering
# both and diffing against the live Deployment: image, resources, serviceAccount
# and both probes match exactly. The only intentional difference is the added
# startupProbe (see below).
#
# Four things that are NOT key renames, and cost the most to discover:
#   1. Probes are hardcoded in the fork's deployment.yaml, absent from its
#      values.yaml. There is nothing to map from — you only find them by reading
#      the template or the live pod.
#   2. The probe schema here is FLAT (`path:`), not nested (`httpGet.path:`).
#      Nesting it half-applies: initialDelaySeconds takes, path silently does not.
#   3. existingSecret (one name, chart wires each key) becomes environmentSecrets
#      (a list whose every key is exported as an env var). It works only because
#      the keys in litellm-secrets already equal the env var names LiteLLM reads.
#   4. db.deployStandalone, postgresql.enabled and migrationJob.enabled all
#      default ON and are absent from the fork, so nothing prompts you to look.
#
# Copy to litellm.{STAGE}.{REGION}.values.yaml in yoloscribe-ops.

# ── Image ────────────────────────────────────────────────────────────────────
# Fork had a single string: image: "ghcr.io/berriai/litellm:main-latest"
image:
  repository: ghcr.io/berriai/litellm
  tag: main-latest

# ── Naming ───────────────────────────────────────────────────────────────────
# The live release is `litellm` and its Service is `litellm:4000`. Honcho and the
# YoloScribe backend address it by that name over cluster DNS, so the rendered
# name must not change.
fullnameOverride: litellm

serviceAccount:
  create: true
  name: litellm
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<aws-account-id>:role/<litellm-irsa-role>"

# ── Secrets ──────────────────────────────────────────────────────────────────
# Fork used existingSecret + per-key secretKeyRef. The official chart exports
# EVERY key of the named Secrets as env vars, which works only because the key
# names in litellm-secrets already equal the env var names LiteLLM reads:
# ANTHROPIC_API_KEY, OPENAI_API_KEY, LITELLM_MASTER_KEY, DATABASE_URL.
environmentSecrets:
  - litellm-secrets

# The two plain values the fork set directly on the container.
envVars:
  AWS_REGION_NAME: <region>
  PROXY_BASE_URL: https://<litellm-hostname>

# ── Database ─────────────────────────────────────────────────────────────────
# DATABASE_URL arrives whole from litellm-secrets, so the chart composes nothing.
# Both of these default ON and would deploy a bundled Postgres.
db:
  useExisting: false
  deployStandalone: false
postgresql:
  enabled: false

# ── Schema migrations ────────────────────────────────────────────────────────
# OFF, deliberately. The chart defaults it ON, but the Job it renders gets
# envFrom: [] — environmentSecrets reaches the Deployment and NOT the Job — so it
# would run prisma_migration.py with no DATABASE_URL and fail every install.
#
# Getting the Job to work means db.useExisting: true with db.secret split into
# username/password/host/database keys, i.e. restructuring the Secrets Manager
# object away from a single DATABASE_URL string. Not worth it for the cutover:
# LiteLLM runs its own Prisma migrations on boot, which is what the live
# deployment already does. Revisit if migrations should become an explicit
# pre-upgrade gate rather than a startup side effect.
migrationJob:
  enabled: false

# The chart adds a startupProbe the fork has no equivalent for. Kept: 30 x 10s
# is more forgiving than the fixed 120s liveness delay it supersedes, so this is
# the one intentional difference from the live Deployment.

# ── Probes ───────────────────────────────────────────────────────────────────
# NOT a key mapping: the fork hardcodes these in its deployment.yaml and they
# appear nowhere in its values.yaml. The official defaults are initialDelay 0,
# which kills the proxy mid-boot. Carried from the live Deployment.
# The chart's probe schema is FLAT — `path:`, not `httpGet.path:`. Nesting it
# silently half-applies: initialDelaySeconds takes and the path does not.
livenessProbe:
  path: /health/liveliness
  initialDelaySeconds: 120
  periodSeconds: 15
  failureThreshold: 5
readinessProbe:
  # Matching live. The chart defaults to /health/readiness, which additionally
  # checks the database — better, but a behaviour change, so adopt it
  # deliberately rather than as a side effect of the port.
  path: /health/liveliness
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 5

# The master key the proxy authenticates with. Without these the chart generates
# its own Secret (litellm-masterkey) holding a value nothing else knows.
masterkeySecretName: litellm-secrets
masterkeySecretKey: LITELLM_MASTER_KEY

resources:
  limits:
    cpu: "2"
    memory: 3Gi
  requests:
    cpu: 250m
    memory: 1Gi

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: true
  className: yolo-shared
  hosts:
    - host: <litellm-hostname>
      paths:
        - path: /
          pathType: Prefix
  annotations:
    external-dns.alpha.kubernetes.io/hostname: <litellm-hostname>
    alb.ingress.kubernetes.io/certificate-arn: <acm-cert-arn>
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'

# ── Proxy config ─────────────────────────────────────────────────────────────
# Fork: `config: |` a raw YAML STRING. Official: a structured map. Same content,
# re-nested rather than copied.
proxy_config:
  model_list:
    - model_name: glm-flash
      litellm_params:
        model: openai/zai.glm-4.7-flash
        api_key: os.environ/OPENAI_API_KEY
        api_base: https://bedrock-mantle.<region>.api.aws/v1
    - model_name: glm-5
      litellm_params:
        model: openai/zai.glm-5
        api_key: os.environ/OPENAI_API_KEY
        api_base: https://bedrock-mantle.<region>.api.aws/v1
    - model_name: text-embedding-3-small
      litellm_params:
        model: bedrock/amazon.titan-embed-text-v1
        aws_region_name: os.environ/AWS_REGION_NAME
        drop_params: true
    - model_name: haiku
      litellm_params:
        model: anthropic/claude-haiku-4-5-20251001
        api_key: os.environ/ANTHROPIC_API_KEY
        max_tokens: 16384
    - model_name: sonnet
      litellm_params:
        model: anthropic/claude-sonnet-4-6
        api_key: os.environ/ANTHROPIC_API_KEY
        max_tokens: 16384
    - model_name: opus
      litellm_params:
        model: anthropic/claude-opus-4-8
        api_key: os.environ/ANTHROPIC_API_KEY
        max_tokens: 16384
    - model_name: bedrock-haiku
      litellm_params:
        model: bedrock/anthropic.claude-haiku-4-5-20251001-v1:0
        aws_region_name: os.environ/AWS_REGION_NAME
        max_tokens: 16384
    - model_name: bedrock-sonnet
      litellm_params:
        model: bedrock/anthropic.claude-sonnet-4-6-20250514-v1:0
        aws_region_name: os.environ/AWS_REGION_NAME
        max_tokens: 16384
    - model_name: bedrock-opus
      litellm_params:
        model: bedrock/anthropic.claude-opus-4-6-20250514-v1:0
        aws_region_name: os.environ/AWS_REGION_NAME
        max_tokens: 16384
  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
