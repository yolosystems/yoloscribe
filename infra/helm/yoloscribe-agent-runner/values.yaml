# ── Image ────────────────────────────────────────────────────────────────────
image:
  repository: ""
  tag: latest
  pullPolicy: Always

# ── GitHub Container Registry credentials ────────────────────────────────────
# Never set ghcr.pat here — pass it via --set on the command line.
ghcr:
  username: ""          # set in environment-specific values file
  pat: ""               # pass via --set; never commit a real value
  # Name of a dockerconfigjson Secret that already exists — normally one synced
  # from Secrets Manager by the yoloscribe-external-secrets chart. When set, the
  # chart renders no pull secret of its own and username/pat are unused.
  existingSecret: ""

# ── Service account (IRSA for SQS receive/delete + S3 read) ──────────────────
serviceAccount:
  create: true
  iamRoleArn: ""

# ── Application config ────────────────────────────────────────────────────────
config:
  sqsQueueUrl: ""
  sqsIndexingQueueUrl: ""
  awsRegion: ""
  k8sNamespace: ""
  agentRunnerImage: ""  # defaults to image.repository:image.tag if empty
  # Optional Anthropic API base URL override (leave empty to use the Anthropic default).
  # Set to a Bedrock Mantle endpoint to route all Anthropic model calls through it.
  modelBaseUrl: ""
  # Global model key fallback, shared with the backend (a LiteLLM model_name: haiku|sonnet|opus|glm|bedrock-*).
  # Leave empty to use "sonnet".
  model: ""
  # LiteLLM proxy OpenAI endpoint — the single model path (YOL-512). REQUIRED for a
  # working deploy; e.g. http://yoloscribe-litellm.yolo.svc.cluster.local:4000/v1
  litellmBaseUrl: ""
  # agent-runner-specific override: used when an agent.md has no `model:` frontmatter field.
  # Falls back to `model` above, then "sonnet", when unset.
  runnerModel: ""
  # Librarian memory reasoner model keys (Anthropic-provider keys only: haiku|sonnet|opus).
  # These reasoners call anthropic.Anthropic directly — bedrock-* and glm keys are not valid here.
  # Leave empty to use the defaults (memoryReasonerModel: haiku, consolidationReasonerModel: sonnet).
  memoryReasonerModel: ""
  consolidationReasonerModel: ""
  # Arize Phoenix REST API base URL (e.g. http://phoenix-svc.arize.svc.cluster.local:6006).
  # Enables the post-run trace fetcher for eval_log agents. Leave empty to disable.
  phoenixApiEndpoint: ""

# ── OTEL / Arize Phoenix tracing ─────────────────────────────────────────────
# Set endpoint to the internal Phoenix service DNS name to enable tracing.
# Pass headers via --set on the command line; never commit a real value here.
otel:
  endpoint: ""   # e.g. http://phoenix-svc.arize.svc.cluster.local:6006
  headers: ""    # e.g. "Authorization=Bearer <token>" — pass via --set
  # Name of a Secret that already holds the OTLP headers — normally synced
  # from Secrets Manager. When set, the headers env var is wired from it and
  # the chart renders no Secret of its own, so no header value need be passed.
  existingSecret: ""
  existingSecretKey: otlp-headers

# ── Anthropic API key secret ──────────────────────────────────────────────────
# Option A: reference an existing Kubernetes secret (recommended for production)
#   existingSecret: yoloscribe-secrets
#   existingSecretKey: anthropic-api-key
#
# Option B: pass the key directly (for development only — do not commit)
#   anthropicApiKey: "sk-ant-..."
existingSecret: ""
existingSecretKey: anthropic-api-key
anthropicApiKey: ""

# ── LiteLLM proxy API key (YOL-512) — the key the runner presents to the proxy.
# Passed via --set by install_runner.sh (from $LITELLM_MASTER_KEY); with
# existingSecret, add this key to that secret.
litellmApiKey: ""
litellmExistingSecretKey: litellm-api-key

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
