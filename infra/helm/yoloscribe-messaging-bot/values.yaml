# ── Image ────────────────────────────────────────────────────────────────────
image:
  repository: ""
  tag: latest
  pullPolicy: Always

# ── GitHub Container Registry credentials ────────────────────────────────────
ghcr:
  username: ""
  pat: ""               # pass via --set; never commit a real value
  # dockerconfigjson Secret synced by yoloscribe-external-secrets.
  existingSecret: ""

# ── Application config ────────────────────────────────────────────────────────
config:
  # Base URL of the YoloScribe backend.
  #
  # Must be the IN-CLUSTER service DNS name, e.g.
  #   http://yoloscribe-backend.yolo.svc.cluster.local:8000
  # The bot calls the backend's /internal/messaging/* endpoints, which the WAF
  # blocks at the ALB (infra/waf/README.md) — a public hostname here would 403.
  yoloscribeApiUrl: ""
  # Comma-separated list of enabled adapters (e.g. "discord" or "discord,slack")
  enabledAdapters: "discord"

# ── Secrets ───────────────────────────────────────────────────────────────────
# Pass all secret values via --set; never commit real values here.
#
# messagingBotSecret — shared secret for the backend's /internal/messaging/*
#                      endpoints, sent as X-Internal-Auth. MUST match the
#                      backend's MESSAGING_BOT_SECRET, and MUST NOT be the same
#                      value as the backend's INTERNAL_MINT_SECRET: this process
#                      handles untrusted chat input, and /internal/runs/mint
#                      accepts an arbitrary site + user_id (YOL-523).
#                      Generate: openssl rand -hex 32
# discordBotToken    — Discord bot token (required when discord adapter is enabled)
#
# The bot no longer holds a database credential, an encryption key, or any user
# API token — the backend resolves channel → owner on every request.
messagingBotSecret: ""
discordBotToken: ""

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# ── Secrets ──────────────────────────────────────────────────────────────────
# Name Secrets that already exist — normally synced from AWS Secrets Manager by
# the yoloscribe-external-secrets release. When set, the chart renders none of
# its own and the inline values below are unused.
existingSecret: ""
